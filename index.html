<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Controle de Estoque</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0a09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estoque">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; font-family: 'Manrope', sans-serif; margin: 0; padding: 0; }
  .mono { font-family: 'DM Mono', monospace; }
  html, body { background: #0c0a09; color: #e7e5e4; height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #44403c; border-radius: 3px; }
  input, select, button { font-family: inherit; }
  input:focus, button:focus-visible, select:focus-visible { outline: 2px solid #15b8c9; outline-offset: 1px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #1c1917; gap: 10px; flex-wrap: wrap; }
  .brand { display: flex; flex-direction: column; gap: 3px; }
  .brand-top { display: flex; align-items: center; gap: 8px; }
  .brand-logo { height: 30px; width: auto; display: block; }
  .version-tag { font-size: 11px; color: #15b8c9; font-weight: 600; background: rgba(21,184,201,0.12); padding: 2px 7px; border-radius: 5px; }
  .brand-sub { font-size: 11px; color: #78716c; }
  .header-actions { display: flex; gap: 6px; }

  .layout { display: flex; flex: 1; overflow: hidden; min-height: 0; }
  .sidebar { width: 230px; border-right: 1px solid #1c1917; display: flex; flex-direction: column; overflow-y: auto; padding: 12px; gap: 4px; flex-shrink: 0; transition: width 0.15s ease, padding 0.15s ease, opacity .15s ease; }
  .sidebar.collapsed { width: 0; padding: 0; opacity: 0; overflow: hidden; }
  .sidebar.compact { width: 76px; padding: 12px 6px; align-items: center; }
  .sidebar-compact-toggle { align-self: flex-end; background: transparent; border: 1px solid #292524; color: #78716c; border-radius: 6px; width: 22px; height: 22px; font-size: 11px; cursor: pointer; margin-bottom: 4px; flex-shrink: 0; }
  .sidebar-compact-toggle:hover { color: #e7e5e4; background: #1c1917; }
  .sidebar.compact .sidebar-compact-toggle { align-self: center; }
  .sidebar.compact .shelf-btn { flex-direction: column; gap: 3px; padding: 8px 2px; text-align: center; }
  .sidebar.compact .shelf-name { font-size: 10.5px; white-space: normal; text-align: center; line-height: 1.2; max-height: 2.4em; overflow: hidden; }
  .sidebar.compact .shelf-row-wrap { width: 100%; }
  .compact-add { width: 100%; justify-content: center; font-size: 16px; padding: 8px 0; }
  .shelf-btn { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 8px; border: none; cursor: pointer; background: transparent; text-align: left; width: 100%; color: #e7e5e4; }
  .shelf-btn:hover { background: #1c1917; }
  .shelf-btn.active { background: #292524; }
  .shelf-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .shelf-name { flex: 1; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shelf-count { font-size: 10px; color: #78716c; }
  .shelf-drop-target { outline: 2px dashed #15b8c9; outline-offset: -2px; background: rgba(21,184,201,0.08); border-radius: 8px; }

  .new-shelf-box { padding: 8px; background: #1c1917; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .color-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .color-dot.selected { border-color: #fafaf9; }

  .shelf-row-wrap { display: flex; align-items: center; gap: 2px; border-radius: 8px; }
  .shelf-reorder-btns { display: flex; flex-direction: column; flex-shrink: 0; }
  .shelf-reorder-btn { background: transparent; border: none; color: #57534e; cursor: pointer; padding: 0 3px; font-size: 8px; line-height: 1.4; }
  .shelf-reorder-btn:hover:not(:disabled) { color: #e7e5e4; }
  .shelf-reorder-btn:disabled { opacity: 0.25; cursor: default; }
  .shelf-row-wrap.dragging { opacity: 0.4; }
  .shelf-delete-btn { background: transparent; border: none; color: #78716c; opacity: 0.55; cursor: pointer; padding: 6px 7px; border-radius: 6px; font-size: 13px; flex-shrink: 0; }
  .shelf-delete-btn:hover, .shelf-delete-btn:active { opacity: 1; color: #f87171; background: #1c1917; }
  .add-shelf-btn { display: flex; align-items: center; gap: 7px; padding: 9px 10px; margin-top: 4px; border-radius: 8px; border: 1px dashed #44403c; background: transparent; color: #a8a29e; font-size: 13px; font-weight: 600; cursor: pointer; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #1c1917; flex-wrap: wrap; }
  .collapse-btn { background: none; border: none; color: #78716c; cursor: pointer; padding: 4px; font-size: 14px; }
  .shelf-title { font-weight: 700; font-size: 14px; flex: 1; min-width: 60px; }
  .search-wrap { position: relative; width: 150px; }
  .search-wrap input { padding-left: 26px !important; }
  .search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: #78716c; font-size: 12px; }
  .scope-toggle { display: flex; border: 1px solid #44403c; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
  .scope-btn { background: transparent; border: none; color: #78716c; font-size: 11px; font-weight: 700; padding: 6px 9px; cursor: pointer; }
  .scope-btn.active { background: #15b8c9; color: #0c0a09; }
  .scope-btn:not(.active):hover { background: #1c1917; color: #e7e5e4; }
  .item-shelf-tag { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: #a8a29e; flex-shrink: 0; background: #1c1917; padding: 3px 7px; border-radius: 5px; }

  .add-item-form { padding: 12px 16px; border-bottom: 1px solid #1c1917; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 10px; color: #78716c; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  input[type=text], input[type=number], select {
    background: #0c0a09; border: 1px solid #44403c; border-radius: 6px; padding: 7px 9px; font-size: 13px; color: #fafaf9; width: 100%;
  }

  .btn { display: flex; align-items: center; justify-content: center; gap: 5px; border-radius: 7px; font-weight: 700; font-size: 13px; cursor: pointer; border: none; padding: 8px 14px; white-space: nowrap; }
  .btn-primary { background: #15b8c9; color: #0c0a09; }
  .btn-ghost { background: transparent; color: #a8a29e; border: 1px solid #44403c; font-weight: 600; }
  .btn-danger { background: #dc2626; color: #fff; }
  .btn-icon { padding: 6px 8px; }

  .items-list { flex: 1; overflow-y: auto; padding: 6px 10px; }
  .empty-state { text-align: center; padding: 40px 20px; color: #57534e; }
  .empty-state .big-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.5; }

  .item-row { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 8px; border-bottom: 1px solid #1c1917; cursor: grab; }
  .item-row:hover { background: #1c1917; }
  .item-row.dragging { opacity: 0.4; }
  .grip { color: #44403c; flex-shrink: 0; font-size: 14px; }
  .item-code-wrap { flex-shrink: 0; width: 64px; overflow: hidden; }
  .item-code { font-size: 11px; color: #a8a29e; background: #1c1917; padding: 3px 7px; border-radius: 5px; text-align: center; white-space: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; cursor: grab; touch-action: pan-x; }
  .item-code::-webkit-scrollbar { display: none; }
  .item-desc-wrap { flex: 1; min-width: 60px; overflow: hidden; }
  .item-desc { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; touch-action: pan-x; cursor: grab; }
  .item-desc::-webkit-scrollbar { display: none; }
  .dragging-text { cursor: grabbing !important; }
  .qty-controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .qty-btn { width: 22px; height: 22px; border-radius: 5px; border: 1px solid #44403c; background: transparent; color: #e7e5e4; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 0; }
  .qty-val-wrap { flex-shrink: 0; width: 40px; overflow: hidden; }
  .qty-val { font-size: 13px; color: #fafaf9; text-align: center; font-weight: 600; white-space: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; cursor: grab; touch-action: pan-x; }
  .qty-val::-webkit-scrollbar { display: none; }
  .move-select { width: 40px; padding: 6px 2px !important; font-size: 11px !important; cursor: pointer; flex-shrink: 0; text-align: center; }

  .edit-row input { width: auto; }
  .edit-code { width: 80px !important; }
  .edit-desc { flex: 1; }
  .edit-qty { width: 70px !important; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
  .modal-box { background: #1c1917; border: 1px solid #292524; border-radius: 12px; padding: 20px; max-width: 320px; width: 100%; }
  .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .modal-text { font-size: 13px; color: #a8a29e; margin-bottom: 16px; line-height: 1.4; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1c1917; color: #fafaf9; padding: 10px 18px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); z-index: 1000; border: 1px solid #292524; opacity: 0; transition: opacity 0.2s ease; pointer-events: none; }
  .toast.show { opacity: 1; }

  .hidden-file-input { display: none; }

  /* Área usada só na hora de gerar o PDF (imprimir). Fica escondida na
     tela normal, e vira a única coisa visível quando a impressão é acionada. */
  .print-only { display: none; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea {
      display: block !important;
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      background: #fff;
      color: #111;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
    }

    #printArea .ph-field-label { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: 0.03em; }

    #printArea .print-header-table { width: 100%; border-collapse: collapse; margin-bottom: 0; }
    #printArea .print-header-table td { border: 1px solid #888; padding: 6px 12px; vertical-align: middle; }
    #printArea .ph-logo { width: 130px; text-align: center; }
    #printArea .ph-logo img { max-width: 110px; max-height: 60px; display: block; margin: 0 auto; }
    #printArea .ph-title { text-align: center; }
    #printArea .ph-title-text { font-size: 14px; font-weight: 700; margin-top: 3px; }
    #printArea .ph-meta { width: 100px; text-align: center; }
    #printArea .ph-meta-value { font-size: 13px; font-weight: 700; margin-top: 3px; }

    #printArea .print-local-row { display: flex; border: 1px solid #888; border-top: none; margin-bottom: 18px; }
    #printArea .print-local { flex: 1; padding: 8px 12px; font-size: 12px; border-right: 1px solid #888; display: flex; align-items: center; gap: 6px; }
    #printArea .print-shelf-badge { padding: 8px 16px; font-size: 13px; font-weight: 700; text-align: center; display: flex; align-items: center; gap: 6px; }

    #printArea .print-items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #printArea .print-items-table th, #printArea .print-items-table td { border: 1px solid #999; padding: 6px 8px; text-align: left; }
    #printArea .print-items-table th { background: #eee; }
    #printArea .print-items-table td:last-child, #printArea .print-items-table th:last-child { text-align: right; width: 90px; }
  }

  @media (max-width: 560px) {
    .sidebar { position: absolute; z-index: 50; background: #0c0a09; height: calc(100vh - 66px); }
    .sidebar.collapsed { display: none; }
    .layout { position: relative; }
  }

  /* Deixa a interface mais compacta quando o celular está deitado
     (pouca altura disponível), pra sobrar espaço pra lista de itens */
  @media (orientation: landscape) and (max-height: 480px) {
    header { padding: 8px 14px; }
    .brand-logo { height: 22px; }
    .version-tag { font-size: 10px; }
    .toolbar, .add-item-form { padding: 8px 14px; }
    .field label { display: none; }
    .sidebar { height: calc(100vh - 50px); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-top">
      <img class="brand-logo" src="assets/logo.png" alt="Denis - Controle de Estoque">
      <span class="version-tag mono">v 0.5</span>
    </div>
    <div class="brand-sub mono" id="headerStats">0 prateleiras · 0 itens · 0 unid.</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-icon" id="exportBtn" title="Exportar backup (.json)">⬇ Backup</button>
    <button class="btn btn-ghost btn-icon" id="importBtn" title="Importar backup (.json)">⬆ Importar</button>
    <input type="file" id="fileInput" accept="application/json" class="hidden-file-input">
  </div>
</header>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div id="shelfList"></div>
  </div>

  <div class="main">
    <div class="toolbar" id="toolbar"></div>
    <div id="addItemFormWrap"></div>
    <div class="items-list" id="itemsList"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<div id="printArea" class="print-only"></div>

  var DOC_INFO = {
    empresa: "Alquimia Cosméticos",
    titulo: "ANEXO II - Identificação do Endereçamento",
    codigo: "POP 085",
    totalPaginas: "1",
    local: "DEPÓSITO DE EMBALAGENS PRIMÁRIAS E SECUNDÁRIAS"
  };

  var state = {
    shelves: [],
    selectedShelfId: null,
    search: "",
    searchScope: "shelf",
    collapsed: false,
    sidebarCompact: false,
    showNewShelf: false,
    newShelfName: "",
    newShelfColor: SHELF_COLORS[0].value,
    editingItemId: null,
    dragItemId: null,
    dragFromShelfId: null,
    dragShelfId: null,
    pdfMeta: { revisao: "000", vigencia: "" }
  };

  function uid() {
    return Math.random().toString(36).slice(2, 10);
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state.shelves = parsed.shelves || [];
        state.selectedShelfId = state.shelves[0] ? state.shelves[0].id : null;
        if (parsed.pdfMeta) {
          state.pdfMeta.revisao = parsed.pdfMeta.revisao || state.pdfMeta.revisao;
          state.pdfMeta.vigencia = parsed.pdfMeta.vigencia || state.pdfMeta.vigencia;
        }
      }
    } catch (e) {
      console.error("Erro ao carregar dados", e);
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ shelves: state.shelves, pdfMeta: state.pdfMeta }));
    } catch (e) {
      showToast("Não consegui salvar (armazenamento cheio ou bloqueado).");
    }
  }

  var toastTimer = null;
  function showToast(text) {
    var el = document.getElementById("toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1800);
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function getSelectedShelf() {
    for (var i = 0; i < state.shelves.length; i++) {
      if (state.shelves[i].id === state.selectedShelfId) return state.shelves[i];
    }
    return null;
  }

  function render() {
    renderHeaderStats();
    renderSidebar();
    renderToolbar();
    renderAddItemForm();
    renderItemsList();
  }

  function renderHeaderStats() {
    var totalItems = 0, totalQty = 0;
    state.shelves.forEach(function (s) {
      totalItems += s.items.length;
      s.items.forEach(function (i) { totalQty += (i.quantity || 0); });
    });
    document.getElementById("headerStats").textContent =
      state.shelves.length + (state.shelves.length === 1 ? " prateleira · " : " prateleiras · ") +
      totalItems + " itens · " + totalQty + " unid.";
  }

  function renderSidebar() {
    var sidebar = document.getElementById("sidebar");
    var compact = state.sidebarCompact;
    sidebar.className = "sidebar" + (state.collapsed ? " collapsed" : "") + (compact ? " compact" : "");
    var html = "";

    html += '<button class="sidebar-compact-toggle" id="toggleCompact" title="' +
      (compact ? "Expandir prateleiras" : "Recolher prateleiras") + '">' + (compact ? "»" : "«") + '</button>';

    state.shelves.forEach(function (shelf, idx) {
      var activeClass = shelf.id === state.selectedShelfId ? " active" : "";
      var isFirst = idx === 0;
      var isLast = idx === state.shelves.length - 1;
      html += '<div class="shelf-drop-wrap shelf-row-wrap" data-shelf-drop="' + shelf.id + '" draggable="true">' +
        (compact ? '' :
          '<div class="shelf-reorder-btns">' +
            '<button class="shelf-reorder-btn" data-move-shelf-up="' + shelf.id + '" ' + (isFirst ? "disabled" : "") + ' title="Mover para cima">▲</button>' +
            '<button class="shelf-reorder-btn" data-move-shelf-down="' + shelf.id + '" ' + (isLast ? "disabled" : "") + ' title="Mover para baixo">▼</button>' +
          '</div>'
        ) +
        '<button class="shelf-btn' + activeClass + '" data-select-shelf="' + shelf.id + '" style="flex:1;" title="' + escapeHtml(shelf.name) + '">' +
          '<span class="shelf-dot" style="background:' + shelf.color + '"></span>' +
          '<span class="shelf-name">' + escapeHtml(shelf.name) + '</span>' +
          (compact ? '' : '<span class="shelf-count mono">' + shelf.items.length + '</span>') +
        '</button>' +
        (compact ? '' : '<button class="shelf-delete-btn" data-delete-shelf="' + shelf.id + '" title="Remover prateleira">🗑</button>') +
      '</div>';
    });

    if (state.showNewShelf) {
      html += '<div class="new-shelf-box">' +
        '<input type="text" id="newShelfNameInput" placeholder="Ex: Prateleira Roxa A5" value="' + escapeHtml(state.newShelfName) + '">' +
        '<div class="color-row">' +
        SHELF_COLORS.map(function (c) {
          var sel = c.value === state.newShelfColor ? " selected" : "";
          return '<button class="color-dot' + sel + '" style="background:' + c.value + '" data-pick-color="' + c.value + '" title="' + c.name + '"></button>';
        }).join("") +
        '</div>' +
        '<div style="display:flex;gap:6px;">' +
          '<button class="btn btn-primary" style="flex:1;padding:6px;" id="confirmNewShelf">✓ Criar</button>' +
          '<button class="btn btn-ghost" style="padding:6px 10px;" id="cancelNewShelf">✕</button>' +
        '</div>' +
      '</div>';
    } else if (compact) {
      html += '<button class="add-shelf-btn compact-add" id="showNewShelfBtn" title="Nova prateleira">+</button>';
    } else {
      html += '<button class="add-shelf-btn" id="showNewShelfBtn">+ Nova prateleira</button>';
    }

    sidebar.innerHTML = html;

    document.getElementById("toggleCompact").addEventListener("click", function () {
      state.sidebarCompact = !state.sidebarCompact;
      renderSidebar();
    });

    // Bind events
    sidebar.querySelectorAll("[data-select-shelf]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.selectedShelfId = btn.getAttribute("data-select-shelf");
        state.search = "";
        render();
      });
    });

    sidebar.querySelectorAll("[data-delete-shelf]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var shelfId = btn.getAttribute("data-delete-shelf");
        var shelf = state.shelves.find(function (s) { return s.id === shelfId; });
        if (!shelf) return;
        openConfirmModal(
          "Remover prateleira?",
          'Isso vai apagar "' + shelf.name + '" e todos os itens dentro dela.',
          function () { removeShelf(shelfId); }
        );
      });
    });

    sidebar.querySelectorAll("[data-move-shelf-up]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        moveShelfStep(btn.getAttribute("data-move-shelf-up"), -1);
      });
    });
    sidebar.querySelectorAll("[data-move-shelf-down]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        moveShelfStep(btn.getAttribute("data-move-shelf-down"), 1);
      });
    });

    sidebar.querySelectorAll("[data-shelf-drop]").forEach(function (wrap) {
      wrap.addEventListener("dragstart", function (e) {
        state.dragShelfId = wrap.getAttribute("data-shelf-drop");
        wrap.classList.add("dragging");
        e.stopPropagation();
      });
      wrap.addEventListener("dragend", function () {
        state.dragShelfId = null;
        wrap.classList.remove("dragging");
      });
      wrap.addEventListener("dragover", function (e) {
        e.preventDefault();
        wrap.classList.add("shelf-drop-target");
      });
      wrap.addEventListener("dragleave", function () {
        wrap.classList.remove("shelf-drop-target");
      });
      wrap.addEventListener("drop", function (e) {
        e.preventDefault();
        wrap.classList.remove("shelf-drop-target");
        var toShelfId = wrap.getAttribute("data-shelf-drop");
        if (state.dragShelfId) {
          reorderShelf(state.dragShelfId, toShelfId);
          state.dragShelfId = null;
        } else if (state.dragItemId && state.dragFromShelfId) {
          moveItem(state.dragItemId, state.dragFromShelfId, toShelfId);
        }
      });
    });

    if (state.showNewShelf) {
      var nameInput = document.getElementById("newShelfNameInput");
      nameInput.focus();
      nameInput.addEventListener("input", function (e) { state.newShelfName = e.target.value; });
      nameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") confirmNewShelf(); });
      document.getElementById("confirmNewShelf").addEventListener("click", confirmNewShelf);
      document.getElementById("cancelNewShelf").addEventListener("click", function () {
        state.showNewShelf = false; state.newShelfName = ""; render();
      });
      sidebar.querySelectorAll("[data-pick-color]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.newShelfColor = btn.getAttribute("data-pick-color");
          render();
        });
      });
    } else {
      document.getElementById("showNewShelfBtn").addEventListener("click", function () {
        state.showNewShelf = true;
        if (state.sidebarCompact) state.sidebarCompact = false;
        render();
      });
    }
  }

  // Reordena as prateleiras: tira a prateleira arrastada do lugar e insere
  // na posição de destino (soltar em cima de outra prateleira).
  function reorderShelf(draggedId, targetId) {
    if (draggedId === targetId) return;
    var shelves = state.shelves;
    var fromIdx = shelves.findIndex(function (s) { return s.id === draggedId; });
    if (fromIdx === -1) return;
    var moved = shelves.splice(fromIdx, 1)[0];
    var toIdx = shelves.findIndex(function (s) { return s.id === targetId; });
    if (toIdx === -1) toIdx = shelves.length;
    shelves.splice(toIdx, 0, moved);
    saveData();
    renderSidebar();
  }

  // Move uma prateleira uma posição pra cima (-1) ou pra baixo (+1) na lista
  // — alternativa confiável no toque, onde arrastar nem sempre funciona bem.
  function moveShelfStep(shelfId, direction) {
    var shelves = state.shelves;
    var idx = shelves.findIndex(function (s) { return s.id === shelfId; });
    if (idx === -1) return;
    var newIdx = idx + direction;
    if (newIdx < 0 || newIdx >= shelves.length) return;
    var tmp = shelves[idx];
    shelves[idx] = shelves[newIdx];
    shelves[newIdx] = tmp;
    saveData();
    renderSidebar();
  }

  function confirmNewShelf() {
    var name = (state.newShelfName || "").trim();
    if (!name) return;
    var shelf = { id: uid(), name: name, color: state.newShelfColor, items: [] };
    state.shelves.push(shelf);
    state.selectedShelfId = shelf.id;
    state.newShelfName = "";
    state.showNewShelf = false;
    saveData();
    render();
    showToast('Prateleira "' + name + '" criada');
  }

  function renderToolbar() {
    var toolbar = document.getElementById("toolbar");
    var shelf = getSelectedShelf();
    var html = '<button class="collapse-btn" id="toggleCollapse">' + (state.collapsed ? "▶" : "▼") + '</button>';

    if (shelf) {
      var scopeAllActive = state.searchScope === "all";
      html += '<span class="shelf-dot" style="background:' + shelf.color + '"></span>' +
        '<div class="shelf-title">' + escapeHtml(shelf.name) + '</div>' +
        '<div class="search-wrap"><span class="search-icon">🔍</span>' +
          '<input type="text" id="searchInput" placeholder="Buscar item..." value="' + escapeHtml(state.search) + '"></div>' +
        '<div class="scope-toggle">' +
          '<button class="scope-btn' + (scopeAllActive ? "" : " active") + '" data-scope="shelf">Esta</button>' +
          '<button class="scope-btn' + (scopeAllActive ? " active" : "") + '" data-scope="all">Todas</button>' +
        '</div>' +
        '<button class="btn btn-ghost btn-icon" id="printShelfBtn" title="Gerar PDF da prateleira">🖨 PDF</button>' +
        '<button class="btn btn-ghost btn-icon" style="color:#f87171;" id="deleteShelfBtn" title="Remover prateleira">🗑</button>';
    } else {
      html += '<div style="font-size:13px;color:#78716c;">Nenhuma prateleira selecionada</div>';
    }

    toolbar.innerHTML = html;

    document.getElementById("toggleCollapse").addEventListener("click", function () {
      state.collapsed = !state.collapsed;
      render();
    });

    if (shelf) {
      document.getElementById("searchInput").addEventListener("input", function (e) {
        state.search = e.target.value;
        renderItemsList();
      });
      document.getElementById("deleteShelfBtn").addEventListener("click", function () {
        openConfirmModal(
          "Remover prateleira?",
          'Isso vai apagar "' + shelf.name + '" e todos os itens dentro dela.',
          function () { removeShelf(shelf.id); }
        );
      });
      toolbar.querySelectorAll("[data-scope]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.searchScope = btn.getAttribute("data-scope");
          renderToolbar();
          renderItemsList();
        });
      });
      document.getElementById("printShelfBtn").addEventListener("click", function () {
        openPdfModal(shelf);
      });
    }
  }

  function renderAddItemForm() {
    var wrap = document.getElementById("addItemFormWrap");
    var shelf = getSelectedShelf();
    if (!shelf) { wrap.innerHTML = ""; return; }

    wrap.innerHTML =
      '<div class="add-item-form">' +
        '<div class="field" style="width:100px;"><label>Código</label><input type="text" id="itemCodeInput" placeholder="Ex: 0231" class="mono"></div>' +
        '<div class="field" style="flex:1;min-width:160px;"><label>Descrição</label><input type="text" id="itemDescInput" placeholder="Ex: Máscara colágeno"></div>' +
        '<div class="field" style="width:80px;"><label>Qtd.</label><input type="number" id="itemQtyInput" placeholder="0" class="mono"></div>' +
        '<button class="btn btn-primary" id="addItemBtn">+ Adicionar</button>' +
      '</div>';

    var descInput = document.getElementById("itemDescInput");
    var qtyInput = document.getElementById("itemQtyInput");
    var codeInput = document.getElementById("itemCodeInput");

    function submit() {
      var description = descInput.value.trim();
      if (!description) { descInput.focus(); return; }
      var code = codeInput.value.trim();
      var quantity = parseInt(qtyInput.value, 10);
      shelf.items.push({
        id: uid(),
        code: code || "—",
        description: description,
        quantity: isFinite(quantity) ? quantity : 0
      });
      saveData();
      codeInput.value = ""; descInput.value = ""; qtyInput.value = "";
      descInput.focus();
      renderHeaderStats();
      renderSidebar();
      renderItemsList();
      showToast('Item "' + description + '" adicionado');
    }

    document.getElementById("addItemBtn").addEventListener("click", submit);
    [codeInput, descInput, qtyInput].forEach(function (inp) {
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
    });
  }

  function renderItemsList() {
    var container = document.getElementById("itemsList");
    var shelf = getSelectedShelf();

    if (!shelf) {
      container.innerHTML = '<div class="empty-state"><div class="big-icon">▤</div><div>Crie uma prateleira para começar a adicionar itens.</div></div>';
      return;
    }

    var q = (state.search || "").trim().toLowerCase();
    var isGlobal = state.searchScope === "all";

    // Monta uma lista de pares {item, shelf} — na busca "Esta" só da
    // prateleira atual, na busca "Todas" juntando todas as prateleiras.
    var pairs = [];
    if (isGlobal) {
      state.shelves.forEach(function (s) {
        s.items.forEach(function (i) { pairs.push({ item: i, shelf: s }); });
      });
    } else {
      shelf.items.forEach(function (i) { pairs.push({ item: i, shelf: shelf }); });
    }

    var filtered = pairs.filter(function (p) {
      if (!q) return true;
      return p.item.description.toLowerCase().indexOf(q) !== -1 || p.item.code.toLowerCase().indexOf(q) !== -1;
    });

    if (isGlobal && !q) {
      container.innerHTML = '<div class="empty-state"><div class="big-icon">🔍</div><div>Digite algo para buscar em todas as prateleiras.</div></div>';
      return;
    }

    if (filtered.length === 0) {
      var msg = (isGlobal ? state.shelves : [shelf]).every(function (s) { return s.items.length === 0; })
        ? "Nenhum item cadastrado ainda."
        : "Nada encontrado para essa busca.";
      container.innerHTML = '<div class="empty-state"><div class="big-icon">📦</div><div>' + msg + '</div></div>';
      return;
    }

    var html = "";
    filtered.forEach(function (p) {
      var item = p.item;
      var ownerShelf = p.shelf;
      var otherShelves = state.shelves.filter(function (s) { return s.id !== ownerShelf.id; });

      if (state.editingItemId === item.id) {
        html += '<div class="item-row edit-row" data-item-id="' + item.id + '">' +
          '<input type="text" class="mono edit-code" value="' + escapeHtml(item.code) + '" id="editCode-' + item.id + '">' +
          '<input type="text" class="edit-desc" value="' + escapeHtml(item.description) + '" id="editDesc-' + item.id + '">' +
          '<input type="number" class="mono edit-qty" value="' + item.quantity + '" id="editQty-' + item.id + '">' +
          '<button class="btn btn-primary btn-icon" data-save-edit="' + item.id + '" data-owner-shelf="' + ownerShelf.id + '">✓</button>' +
          '<button class="btn btn-ghost btn-icon" data-cancel-edit="' + item.id + '">✕</button>' +
        '</div>';
      } else {
        var moveOptions = '<option value="">↦</option>' + otherShelves.map(function (s) {
          return '<option value="' + s.id + '">' + escapeHtml(s.name) + '</option>';
        }).join("");

        html += '<div class="item-row" data-item-id="' + item.id + '" data-owner-shelf="' + ownerShelf.id + '" draggable="true">' +
          '<span class="grip">⠿</span>' +
          (isGlobal ? '<span class="item-shelf-tag"><span class="shelf-dot" style="width:7px;height:7px;background:' + ownerShelf.color + '"></span>' + escapeHtml(ownerShelf.name) + '</span>' : '') +
          '<div class="item-code-wrap"><div class="item-code mono" data-hscroll>' + escapeHtml(item.code) + '</div></div>' +
          '<div class="item-desc-wrap"><div class="item-desc" data-hscroll>' + escapeHtml(item.description) + '</div></div>' +
          '<div class="qty-controls">' +
            '<button class="qty-btn" data-qty-down="' + item.id + '" data-owner-shelf="' + ownerShelf.id + '">−</button>' +
            '<div class="qty-val-wrap"><div class="qty-val mono" data-hscroll>' + item.quantity + '</div></div>' +
            '<button class="qty-btn" data-qty-up="' + item.id + '" data-owner-shelf="' + ownerShelf.id + '">+</button>' +
          '</div>' +
          (otherShelves.length ? '<select class="move-select" data-move-item="' + item.id + '" data-owner-shelf="' + ownerShelf.id + '">' + moveOptions + '</select>' : '') +
          '<button class="btn btn-ghost btn-icon" data-edit-item="' + item.id + '">✎</button>' +
          '<button class="btn btn-ghost btn-icon" style="color:#f87171;" data-delete-item="' + item.id + '" data-owner-shelf="' + ownerShelf.id + '">🗑</button>' +
        '</div>';
      }
    });

    container.innerHTML = html;

    function findShelf(id) {
      return state.shelves.find(function (s) { return s.id === id; });
    }

    // Bind: quantity
    container.querySelectorAll("[data-qty-up]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var s = findShelf(btn.getAttribute("data-owner-shelf"));
        if (s) bumpQty(s, btn.getAttribute("data-qty-up"), 1);
      });
    });
    container.querySelectorAll("[data-qty-down]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var s = findShelf(btn.getAttribute("data-owner-shelf"));
        if (s) bumpQty(s, btn.getAttribute("data-qty-down"), -1);
      });
    });

    // Bind: move via select
    container.querySelectorAll("[data-move-item]").forEach(function (sel) {
      sel.addEventListener("change", function () {
        var toId = sel.value;
        var fromId = sel.getAttribute("data-owner-shelf");
        if (toId) moveItem(sel.getAttribute("data-move-item"), fromId, toId);
      });
    });

    // Bind: edit
    container.querySelectorAll("[data-edit-item]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.editingItemId = btn.getAttribute("data-edit-item");
        renderItemsList();
      });
    });
    container.querySelectorAll("[data-cancel-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.editingItemId = null;
        renderItemsList();
      });
    });
    container.querySelectorAll("[data-save-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-save-edit");
        var s = findShelf(btn.getAttribute("data-owner-shelf"));
        if (s) saveEditItem(s, id);
      });
    });

    // Bind: delete
    container.querySelectorAll("[data-delete-item]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-delete-item");
        var ownerShelfId = btn.getAttribute("data-owner-shelf");
        var s = findShelf(ownerShelfId);
        var item = s ? s.items.find(function (i) { return i.id === id; }) : null;
        openConfirmModal(
          "Remover item?",
          'Isso vai remover "' + (item ? item.description : "") + '" da prateleira.',
          function () { removeItem(ownerShelfId, id); }
        );
      });
    });

    // Bind: arrastar caixas de texto que podem estourar (código, descrição,
    // quantidade) na horizontal, sem disparar o drag de mover item entre
    // prateleiras
    container.querySelectorAll("[data-hscroll]").forEach(function (el) {
      el.setAttribute("draggable", "false");
      el.addEventListener("dragstart", function (e) { e.stopPropagation(); e.preventDefault(); });
      el.addEventListener("mousedown", function (e) { e.stopPropagation(); });
      el.addEventListener("touchstart", function (e) { e.stopPropagation(); }, { passive: true });

      // Suporte a arrastar com o mouse (desktop/trackpad); no toque, o
      // scroll horizontal nativo já funciona sozinho.
      var isDown = false, startX = 0, startScroll = 0;
      el.addEventListener("mousedown", function (e) {
        isDown = true;
        el.classList.add("dragging-text");
        startX = e.pageX;
        startScroll = el.scrollLeft;
      });
      window.addEventListener("mousemove", function (e) {
        if (!isDown) return;
        el.scrollLeft = startScroll - (e.pageX - startX);
      });
      window.addEventListener("mouseup", function () {
        isDown = false;
        el.classList.remove("dragging-text");
      });
    });

    // Bind: drag
    container.querySelectorAll(".item-row[draggable=true]").forEach(function (row) {
      row.addEventListener("dragstart", function () {
        state.dragItemId = row.getAttribute("data-item-id");
        state.dragFromShelfId = row.getAttribute("data-owner-shelf");
        row.classList.add("dragging");
      });
      row.addEventListener("dragend", function () {
        row.classList.remove("dragging");
        state.dragItemId = null;
        state.dragFromShelfId = null;
      });
    });
  }

  function bumpQty(shelf, itemId, delta) {
    var item = shelf.items.find(function (i) { return i.id === itemId; });
    if (!item) return;
    item.quantity = Math.max(0, (item.quantity || 0) + delta);
    saveData();
    renderHeaderStats();
    renderSidebar();
    renderItemsList();
  }

  function saveEditItem(shelf, itemId) {
    var item = shelf.items.find(function (i) { return i.id === itemId; });
    if (!item) return;
    var code = document.getElementById("editCode-" + itemId).value.trim();
    var description = document.getElementById("editDesc-" + itemId).value.trim();
    var quantity = parseInt(document.getElementById("editQty-" + itemId).value, 10);
    item.code = code || "—";
    if (description) item.description = description;
    item.quantity = isFinite(quantity) ? quantity : item.quantity;
    state.editingItemId = null;
    saveData();
    renderHeaderStats();
    renderSidebar();
    renderItemsList();
  }

  function removeItem(shelfId, itemId) {
    var shelf = state.shelves.find(function (s) { return s.id === shelfId; });
    if (!shelf) return;
    shelf.items = shelf.items.filter(function (i) { return i.id !== itemId; });
    closeModal();
    saveData();
    renderHeaderStats();
    renderSidebar();
    renderItemsList();
    showToast("Item removido");
  }

  function removeShelf(shelfId) {
    var shelf = state.shelves.find(function (s) { return s.id === shelfId; });
    state.shelves = state.shelves.filter(function (s) { return s.id !== shelfId; });
    if (state.selectedShelfId === shelfId) {
      state.selectedShelfId = state.shelves[0] ? state.shelves[0].id : null;
    }
    closeModal();
    saveData();
    render();
    showToast('Prateleira "' + (shelf ? shelf.name : "") + '" removida');
  }

  // Pergunta a Revisão e a Vigência (únicos campos que mudam a cada PDF
  // gerado) antes de montar o documento, já vindo preenchido com o último
  // valor usado.
  function openPdfModal(shelf) {
    var root = document.getElementById("modalRoot");
    var vigenciaDefault = state.pdfMeta.vigencia || todayBR();
    root.innerHTML =
      '<div class="modal-overlay" id="modalOverlay">' +
        '<div class="modal-box">' +
          '<div class="modal-title">Gerar PDF — ' + escapeHtml(shelf.name) + '</div>' +
          '<div class="modal-text">Confirme os dados desta versão do documento.</div>' +
          '<div class="field" style="margin-bottom:10px;">' +
            '<label>Revisão</label>' +
            '<input type="text" id="pdfRevisaoInput" value="' + escapeHtml(state.pdfMeta.revisao) + '">' +
          '</div>' +
          '<div class="field" style="margin-bottom:16px;">' +
            '<label>Vigência</label>' +
            '<input type="text" id="pdfVigenciaInput" placeholder="dd/mm/aaaa" value="' + escapeHtml(vigenciaDefault) + '">' +
          '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-ghost" id="pdfModalCancel">Cancelar</button>' +
            '<button class="btn btn-primary" id="pdfModalConfirm">🖨 Gerar</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    function close() { root.innerHTML = ""; }
    document.getElementById("pdfModalCancel").addEventListener("click", close);
    document.getElementById("modalOverlay").addEventListener("click", function (e) {
      if (e.target.id === "modalOverlay") close();
    });
    document.getElementById("pdfModalConfirm").addEventListener("click", function () {
      var revisao = document.getElementById("pdfRevisaoInput").value.trim() || "000";
      var vigencia = document.getElementById("pdfVigenciaInput").value.trim() || vigenciaDefault;
      state.pdfMeta.revisao = revisao;
      state.pdfMeta.vigencia = vigencia;
      saveData();
      close();
      printShelf(shelf, revisao, vigencia);
    });
  }

  function todayBR() {
    var d = new Date();
    var dd = String(d.getDate()).padStart(2, "0");
    var mm = String(d.getMonth() + 1).padStart(2, "0");
    return dd + "/" + mm + "/" + d.getFullYear();
  }

  // Monta o cabeçalho no padrão do documento da empresa (logo, Assunto/
  // Título, Revisão/Código/Vigência/Total de páginas, Local e a etiqueta da
  // prateleira) seguido da tabela Código/Descrição/Quantidade, e abre a tela
  // de impressão do navegador, onde o usuário pode escolher "Salvar como PDF".
  function printShelf(shelf, revisao, vigencia) {
    var printArea = document.getElementById("printArea");

    var rows = shelf.items.map(function (item) {
      return "<tr>" +
        "<td>" + escapeHtml(item.code) + "</td>" +
        "<td>" + escapeHtml(item.description) + "</td>" +
        "<td>" + item.quantity + "</td>" +
      "</tr>";
    }).join("");

    printArea.innerHTML =
      '<table class="print-header-table"><tbody>' +
        '<tr>' +
          '<td class="ph-logo" rowspan="2"><img src="data:image/png;base64,' + LOGO_EMPRESA_B64 + '" alt="' + escapeHtml(DOC_INFO.empresa) + '"></td>' +
          '<td class="ph-title" rowspan="2">' +
            '<div class="ph-field-label">Assunto/Título</div>' +
            '<div class="ph-title-text">' + escapeHtml(DOC_INFO.titulo) + '</div>' +
          '</td>' +
          '<td class="ph-meta"><div class="ph-field-label">Revisão</div><div class="ph-meta-value">' + escapeHtml(revisao) + '</div></td>' +
          '<td class="ph-meta"><div class="ph-field-label">Código</div><div class="ph-meta-value">' + escapeHtml(DOC_INFO.codigo) + '</div></td>' +
        '</tr>' +
        '<tr>' +
          '<td class="ph-meta"><div class="ph-field-label">Vigência</div><div class="ph-meta-value">' + escapeHtml(vigencia) + '</div></td>' +
          '<td class="ph-meta"><div class="ph-field-label">Total de páginas</div><div class="ph-meta-value">' + escapeHtml(DOC_INFO.totalPaginas) + '</div></td>' +
        '</tr>' +
      '</tbody></table>' +
      '<div class="print-local-row">' +
        '<div class="print-local"><b class="ph-field-label" style="font-size:11px;">Local:</b> ' + escapeHtml(DOC_INFO.local) + '</div>' +
        '<div class="print-shelf-badge" style="background:' + shelf.color + '22;border-left:4px solid ' + shelf.color + ';">' +
          '<span class="ph-field-label" style="font-size:11px;">Prateleira</span>&nbsp;<b>' + escapeHtml(shelf.name) + '</b>' +
        '</div>' +
      '</div>' +
      '<table class="print-items-table">' +
        '<thead><tr><th>Código</th><th>Descrição</th><th>Quantidade</th></tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="3" style="text-align:center;color:#666;">Nenhum item nesta prateleira.</td></tr>') + '</tbody>' +
      '</table>';

    // Só aciona a impressão depois que a imagem da logo terminar de
    // carregar/decodificar de verdade — mesmo sendo embutida (base64), o
    // navegador decodifica de forma assíncrona, e imprimir cedo demais
    // pode gerar um PDF com a logo em branco.
    var logoImg = printArea.querySelector(".ph-logo img");
    var printed = false;
    function triggerPrint() {
      if (printed) return;
      printed = true;
      window.print();
    }
    if (logoImg && !logoImg.complete) {
      logoImg.addEventListener("load", triggerPrint, { once: true });
      logoImg.addEventListener("error", triggerPrint, { once: true });
      // salvaguarda: se por algum motivo o evento não disparar, imprime
      // mesmo assim depois de um instante
      setTimeout(triggerPrint, 400);
    } else {
      triggerPrint();
    }
  }

  function moveItem(itemId, fromShelfId, toShelfId) {
    if (fromShelfId === toShelfId) return;
    var fromShelf = state.shelves.find(function (s) { return s.id === fromShelfId; });
    var toShelf = state.shelves.find(function (s) { return s.id === toShelfId; });
    if (!fromShelf || !toShelf) return;
    var idx = fromShelf.items.findIndex(function (i) { return i.id === itemId; });
    if (idx === -1) return;
    var item = fromShelf.items.splice(idx, 1)[0];
    toShelf.items.push(item);
    state.dragItemId = null;
    state.dragFromShelfId = null;
    saveData();
    renderHeaderStats();
    renderSidebar();
    renderItemsList();
    showToast('"' + item.description + '" movido para ' + toShelf.name);
  }

  // Modal
  function openConfirmModal(title, text, onConfirm) {
    var root = document.getElementById("modalRoot");
    root.innerHTML =
      '<div class="modal-overlay" id="modalOverlay">' +
        '<div class="modal-box">' +
          '<div class="modal-title">' + escapeHtml(title) + '</div>' +
          '<div class="modal-text">' + escapeHtml(text) + '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-ghost" id="modalCancel">Cancelar</button>' +
            '<button class="btn btn-danger" id="modalConfirm">Remover</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById("modalCancel").addEventListener("click", closeModal);
    document.getElementById("modalOverlay").addEventListener("click", function (e) {
      if (e.target.id === "modalOverlay") closeModal();
    });
    document.getElementById("modalConfirm").addEventListener("click", onConfirm);
  }

  function closeModal() {
    document.getElementById("modalRoot").innerHTML = "";
  }

  // Export / Import backup
  document.getElementById("exportBtn").addEventListener("click", function () {
    var data = JSON.stringify({ shelves: state.shelves }, null, 2);
    var blob = new Blob([data], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = "backup-estoque-" + date + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Backup exportado");
  });

  document.getElementById("importBtn").addEventListener("click", function () {
    document.getElementById("fileInput").click();
  });

  document.getElementById("fileInput").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (evt) {
      try {
        var parsed = JSON.parse(evt.target.result);
        if (!parsed || !Array.isArray(parsed.shelves)) throw new Error("Formato inválido");
        openConfirmModal(
          "Importar backup?",
          "Isso vai SUBSTITUIR todos os dados atuais pelos dados do arquivo importado.",
          function () {
            state.shelves = parsed.shelves;
            state.selectedShelfId = state.shelves[0] ? state.shelves[0].id : null;
            closeModal();
            saveData();
            render();
            showToast("Backup importado com sucesso");
          }
        );
      } catch (err) {
        showToast("Arquivo inválido. Use um backup exportado por este sistema.");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  // Init
  loadData();
  render();

  // Registra o service worker para uso offline (PWA)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (err) {
        console.log("Falha ao registrar service worker:", err);
      });
    });
  }
})();
</script>
